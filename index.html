<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Klangflug</title>
<link href="https://fonts.googleapis.com/css2?family=Michroma&display=swap" rel="stylesheet">
<style>
:root{--bg:#05030c;--fg:#e9e4ff;--ac:#7cf0ff;--panel:rgba(12,8,28,.78);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;background:radial-gradient(ellipse at 50% 40%,#1a0f3a 0%,var(--bg) 70%);z-index:5}
#start h1{font:400 clamp(26px,8vw,48px)/1.1 Michroma,system-ui,sans-serif;margin:0;letter-spacing:.04em}
#start p{max-width:34ch;margin:0;opacity:.8}
button{font:inherit;color:var(--fg);background:transparent;border:1px solid rgba(233,228,255,.35);border-radius:999px;padding:10px 18px;cursor:pointer}
button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
button.main{background:var(--ac);color:#05030c;border-color:var(--ac);font-weight:600}
button.on{border-color:var(--ac);color:var(--ac)}
#bar{position:fixed;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--panel));transition:opacity .5s;z-index:4}
#bar.hide{opacity:0;pointer-events:none}
#msg{min-height:1.4em;color:#ffb36b}
#err{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:12px;right:12px;text-align:center;color:#ffb36b;z-index:6;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="start">
  <h1>Klangflug</h1>
  <p>Spiele Musik ab und halte das Handy in Hörweite. Die Bilder folgen Bass, Mitten und Höhen.</p>
  <button class="main" id="sys" hidden>Systemton erfassen</button>
  <button class="main" id="mic">Mikrofon starten</button>
  <button id="demo">Ohne Ton testen</button>
  <p id="msg"></p>
</div>
<div id="err"></div>
<div id="bar" class="hide"></div>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d'),bar=document.getElementById('bar'),msg=document.getElementById('msg');
let W,H,D=Math.min(devicePixelRatio||1,2);
function rs(){W=cv.width=innerWidth*D|0;H=cv.height=innerHeight*D|0}
addEventListener('resize',rs);rs();

let an=null,native=false,frameN=0,demo=false,t=0,mode=0,pk=.15,fd=new Uint8Array(256);
const lv={b:0,m:0,h:0,beat:0};let avg=0;

async function startMic(){
  try{
    const s=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    const ac=new(window.AudioContext||window.webkitAudioContext)();
    an=ac.createAnalyser();an.fftSize=512;an.smoothingTimeConstant=.72;
    ac.createMediaStreamSource(s).connect(an);
    go();
  }catch(e){msg.textContent='Kein Zugriff auf das Mikrofon. Erlaube den Zugriff oder teste ohne Ton.'}
}
function go(){
  document.getElementById('start').remove();
  bar.classList.remove('hide');poke();
  try{navigator.wakeLock&&navigator.wakeLock.request('screen')}catch(e){}
  requestAnimationFrame(loop);
}
document.getElementById('mic').onclick=startMic;
document.getElementById('demo').onclick=()=>{demo=true;go()};
function showErr(m){const e=document.getElementById('err');e.textContent=m;setTimeout(()=>e.textContent='',6000)}
if(typeof Android!=='undefined'){
  document.getElementById('sys').hidden=false;document.getElementById('mic').classList.remove('main');
  document.getElementById('sys').onclick=()=>{native=true;Android.startSystem();go()};
  document.getElementById('mic').onclick=()=>{native=true;Android.startMic();go()};
}

const names=['Sternenflug','Kaleidoskop','Neon-Ringe','Cockpit'];
names.forEach((n,i)=>{const b=document.createElement('button');b.textContent=n;b.onclick=e=>{e.stopPropagation();setMode(i)};bar.appendChild(b)});
const fs=document.createElement('button');fs.textContent='Vollbild';
fs.onclick=e=>{e.stopPropagation();try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(x){}};
bar.appendChild(fs);
function setMode(i){mode=i;rings.length=0;blips.length=0;g.fillStyle='#05030c';g.fillRect(0,0,W,H);[...bar.children].forEach((b,j)=>b.classList.toggle('on',j===i));poke()}
let hideT;function poke(){bar.classList.remove('hide');clearTimeout(hideT);hideT=setTimeout(()=>bar.classList.add('hide'),3500)}
cv.addEventListener('click',()=>{bar.classList.contains('hide')?poke():setMode((mode+1)%names.length)});

function upd(){
  if(native){const f=Android.frame();for(let i=0;i<256&&i<f.length;i++)fd[i]=f.charCodeAt(i)-1}
  else if(an&&!demo)an.getByteFrequencyData(fd);
  else{
    for(let i=0;i<256;i++)fd[i]=Math.max(0,(Math.sin(t*2+i*.15)*.5+.5)*255*Math.exp(-i/60)*(.5+.5*Math.sin(t*3.1+i*.05)));
    const k=Math.pow(Math.max(0,Math.sin(t*Math.PI*2*2.1)),6);
    for(let i=0;i<8;i++)fd[i]=Math.min(255,fd[i]+k*200);
  }
  const a=(s,e)=>{let x=0;for(let i=s;i<e;i++)x+=fd[i];return x/(e-s)/255};
  let b=a(0,6),m=a(6,40),h=a(40,120);
  pk=Math.max(pk*.997,b,m,h,.12);b/=pk;m/=pk;h/=pk;
  lv.beat=Math.max(0,lv.beat-.06);
  if(b>avg*1.25&&b>.45&&lv.beat<.3)lv.beat=1;
  avg=avg*.92+b*.08;
  lv.b+=(b-lv.b)*.4;lv.m+=(m-lv.m)*.3;lv.h+=(h-lv.h)*.3;
}
const fade=a=>{g.globalCompositeOperation='source-over';g.fillStyle='rgba(5,3,12,'+a+')';g.fillRect(0,0,W,H)};

/* 1 Sternenflug */
const S=Array.from({length:420},()=>({x:Math.random()*2-1,y:Math.random()*2-1,z:Math.random()}));
function warp(){
  fade(.28-lv.b*.12);
  const sp=.004+lv.b*.03+lv.beat*.02,f=Math.max(W,H)*.075,
    cx=W/2+Math.sin(t*.5)*W*.12*lv.m,cy=H/2+Math.cos(t*.4)*H*.12*lv.m;
  g.globalCompositeOperation='lighter';g.lineCap='round';
  for(const s of S){
    const z0=s.z;s.z-=sp;
    if(s.z<=.02){s.x=Math.random()*2-1;s.y=Math.random()*2-1;s.z=1;continue}
    g.strokeStyle=`hsl(${190+(1-s.z)*140+lv.h*70},100%,${55+lv.beat*20}%)`;
    g.lineWidth=((1-s.z)*3+lv.h*2)*D;
    g.beginPath();g.moveTo(cx+s.x/z0*f,cy+s.y/z0*f);g.lineTo(cx+s.x/s.z*f,cy+s.y/s.z*f);g.stroke();
  }
  if(lv.beat>.2){g.strokeStyle=`hsla(${280+lv.m*60},100%,70%,${lv.beat*.5})`;g.lineWidth=3*D;g.beginPath();g.arc(cx,cy,(1-lv.beat)*Math.min(W,H)*.35+10,0,7);g.stroke()}
}

/* 2 Kaleidoskop */
function kal(){
  fade(.16);
  g.save();g.translate(W/2,H/2);g.globalCompositeOperation='lighter';
  const R=Math.min(W,H)*.46,N=8;g.lineWidth=(1.5+lv.b*3)*D;g.lineJoin='round';
  for(let k=0;k<N;k++){
    g.save();g.rotate(k*Math.PI*2/N+t*.15);if(k%2)g.scale(1,-1);
    g.strokeStyle=`hsl(${(t*30+k*9+lv.m*120)%360},100%,60%)`;
    g.beginPath();
    for(let i=0;i<64;i++){
      const v=fd[i*2]/255*(.7+lv.b*.5),r=R*(.12+.88*v),a=i/63*Math.PI/N;
      i?g.lineTo(Math.cos(a)*r,Math.sin(a)*r):g.moveTo(Math.cos(a)*r,Math.sin(a)*r);
    }
    g.stroke();
    g.strokeStyle=`hsla(${(t*30+180+k*9)%360},100%,65%,.6)`;
    g.beginPath();g.moveTo(0,0);g.bezierCurveTo(R*.3,-R*.25*lv.m,R*.6,R*.3*lv.b,R*(.4+lv.h*.5),0);g.stroke();
    g.restore();
  }
  g.restore();
}

/* 3 Neon-Ringe */
const rings=[];
function rng(){
  fade(.12);
  if(lv.beat>.95||Math.random()<lv.h*.04)rings.push({r:0,h:(t*40)%360,w:3+lv.b*14,ph:Math.random()*6});
  g.globalCompositeOperation='lighter';
  const cx=W/2,cy=H/2,mx=Math.hypot(W,H)/2;
  for(let i=rings.length-1;i>=0;i--){
    const q=rings[i];q.r+=(3+lv.b*16)*D*.7;
    if(q.r>mx){rings.splice(i,1);continue}
    const life=1-q.r/mx;
    g.strokeStyle=`hsla(${q.h+q.r*.12},100%,60%,${life})`;g.lineWidth=q.w*D*life+1;
    g.beginPath();
    for(let a=0;a<=72;a++){
      const th=a/72*6.2832,rr=q.r*(1+.1*lv.m*Math.sin(th*6+t*3+q.ph)+.05*lv.h*Math.sin(th*11-t*4));
      a?g.lineTo(cx+Math.cos(th)*rr,cy+Math.sin(th)*rr):g.moveTo(cx+Math.cos(th)*rr,cy+Math.sin(th)*rr);
    }
    g.stroke();
  }
  const or=Math.min(W,H)*(.06+lv.b*.1),gr=g.createRadialGradient(cx,cy,0,cx,cy,or);
  gr.addColorStop(0,`hsla(${(t*40+60)%360},100%,80%,.9)`);gr.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=gr;g.beginPath();g.arc(cx,cy,or,0,7);g.fill();
}

/* 4 Cockpit */
const blips=[];
function cock(){
  fade(.35);
  const hor=H*.58,cx=W/2,hue=lv.beat>.3?40:175;
  g.globalCompositeOperation='lighter';g.lineWidth=D;
  g.strokeStyle=`hsla(${hue},100%,55%,.55)`;
  for(let i=0;i<14;i++){const p=((i+t*(1.5+lv.b*5))%14)/14,y=hor+(H-hor)*p*p;g.globalAlpha=p;g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke()}
  for(let j=-10;j<=10;j++){g.globalAlpha=.5;g.beginPath();g.moveTo(cx+j*W*.015,hor);g.lineTo(cx+j*W*.14,H);g.stroke()}
  g.globalAlpha=1;
  const rx=cx,ry=H*.3,R=Math.min(W,H)*.22;
  g.strokeStyle=`hsla(${hue},100%,60%,.7)`;g.lineWidth=2*D;
  g.beginPath();g.arc(rx,ry,R,0,7);g.stroke();
  g.lineWidth=D;g.beginPath();g.arc(rx,ry,R*.66,0,7);g.stroke();g.beginPath();g.arc(rx,ry,R*.33,0,7);g.stroke();
  g.beginPath();g.moveTo(rx-R,ry);g.lineTo(rx+R,ry);g.moveTo(rx,ry-R);g.lineTo(rx,ry+R);g.stroke();
  g.lineWidth=2.5*D;
  for(let i=0;i<96;i++){
    const a=i/96*6.2832,v=fd[(i<48?i:96-i)*2]/255,l=R*(.05+.35*v);
    g.strokeStyle=`hsl(${hue+v*60},100%,${50+v*25}%)`;
    g.beginPath();g.moveTo(rx+Math.cos(a)*(R*1.04),ry+Math.sin(a)*(R*1.04));g.lineTo(rx+Math.cos(a)*(R*1.04+l),ry+Math.sin(a)*(R*1.04+l));g.stroke();
  }
  const sw=t*2.2;
  for(let k=0;k<24;k++){g.strokeStyle=`hsla(${hue},100%,60%,${.28*(1-k/24)})`;g.lineWidth=2*D;const a=sw-k*.04;g.beginPath();g.moveTo(rx,ry);g.lineTo(rx+Math.cos(a)*R,ry+Math.sin(a)*R);g.stroke()}
  if(lv.beat>.95)blips.push({a:Math.random()*6.28,r:Math.random()*R*.9,life:1});
  for(let i=blips.length-1;i>=0;i--){
    const q=blips[i];q.life-=.012;if(q.life<=0){blips.splice(i,1);continue}
    g.fillStyle=`hsla(40,100%,65%,${q.life})`;g.beginPath();g.arc(rx+Math.cos(q.a)*q.r,ry+Math.sin(q.a)*q.r,(3+8*(1-q.life))*D,0,7);g.fill();
  }
}

let last=0;
function loop(ts){
  const dt=Math.min((ts-last)/1000,.05);last=ts;t+=dt;upd();
  if(native&&frameN++%60===0){const e=Android.error();if(e)showErr(e)}
  g.globalAlpha=1;g.globalCompositeOperation='source-over';
  [warp,kal,rng,cock][mode]();
  requestAnimationFrame(loop);
}
setMode(0);
</script>
</body>
</html>
